# docker-compose up -d
# docker-compose down
services:
  mysql:
    image: brenda0407/mysql:8.0
    container_name: universidad-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: universidad_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  postgres:
    image: brenda0407/postgres:16
    container_name: universidad-postgres
    environment:
      POSTGRES_DB: universidad_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mysql_data:
  postgres_data:



